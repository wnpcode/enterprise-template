name: Release

# Changesets: push ke main membuka (atau memperbarui) PR "Version Packages" bila ada .changeset/*.md;
# menggabungkan PR itu mempublikasikan @wnpcode/design-system ke GitHub Packages.
# Perlu Settings > Actions > General > "Allow GitHub Actions to create and approve pull requests".
on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@wnpcode"
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --filter @wnpcode/design-system test
      - uses: changesets/action@v1
        with:
          version: pnpm release:version
          publish: pnpm release:publish
          title: "release: versi baru @wnpcode/design-system"
          commit: "release: versi baru @wnpcode/design-system"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
