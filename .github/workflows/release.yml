name: Release

# Changesets: push ke main membuka (atau memperbarui) PR "Version Packages" bila ada .changeset/*.md;
# menggabungkan PR itu mempublikasikan @wnp_code/design-system ke npmjs.com (publik) dan menaikkan versi app web
# (private, tidak dipublikasikan) yang dipakai tur produk di apps/web/src/shared/releases.ts.
# Provenance npm aktif ("provenance": true di publishConfig paket + id-token: write). Hanya didukung untuk repo publik:
# bila repo dijadikan private, publish gagal E422 sampai provenance dimatikan.
# Perlu secret repo NPM_TOKEN (npm granular token, publish untuk @wnp_code/*).
# Perlu Settings > Actions > General > "Allow GitHub Actions to create and approve pull requests".
on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          # changesets/action menyiapkan kredensial git sendiri; token tidak perlu tersimpan selama install dan test
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      # apps/* membaca design system dari dist (di-gitignore): bangun dulu sebelum typecheck
      - run: pnpm --filter @wnp_code/design-system build
      - run: pnpm typecheck
      - run: pnpm --filter @wnp_code/design-system test
      - uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm release:version
          publish: pnpm release:publish
          title: "release: versi baru"
          commit: "release: versi baru"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
